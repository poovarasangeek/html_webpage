<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Register</title>
  <link rel="stylesheet" href=style.css>

</head>

</html>

<body>
<center>
  <h1 class="one">STUDENT REGISTER</h1>

  <div class="rows">
    <form>
      <table>
        <tr>
          <h3>(KINDLY USE BOLD LETTERS)</h3>
        </tr>
        <tr>
          <td>NAME</td>
          <td><input type=text placeholder="ENTER NAME" </td>
        </tr>
        <tr>
          <td>GENDER</td>
          <td><input type=radio name=gen>MALE
            <input type=radio name=gen>FEMALE
          </td>

        </tr>
        <tr>
          <td>SELECT AGE</td>
          <td><input type="date" </td>

        </tr>
        <tr>
          <td>FATHER NAME</td>
          <td><input type=text placeholder="FATHER NAME" </td>

        </tr>
        <tr>
        <td>ANNUAL INCOME</td>
        <td><select>
            <option>NONE</option>
            <option>BELOW 1 LAKH</option>
            <option>BELOW 2 LAKHS</option>
            <option>GREATER THAN 2 LAKHS</option>
          </select></td></tr>
        <tr>
          <td>
            CATEGORY
          </td>
          <td>
            <select>
              <option>SELECT</option>
              <option>OC</option>
              <option>BC</option>
              <option>BCM</option>
              <option>MBC</option>
              <option>DNC</option>
              <option>SC</option>
              <option>ST</option>

            </select>
          </td>

        </tr>
        <tr>
          <td>
            MOBILE NUMBER
          </td>
          <td><input type=number placeholder="MOBILE NUMBER"></td>
        </tr>
        <tr>
          <td>
            EMAIL ID
          </td>
          <td><input type=text placeholder="EMAIL ID"></td>
        </tr>
        <tr>
          <td>
            UPLOAD YOUR PHOTO
          </td>
          <td><input type=file></td>
        </tr>

        <tr>
          <td>ADHAAR NO
          </td>
          <td><input type=number placeholder="ENTER NO">
          </td>
        </tr>
        <tr>
          <td>
            SSLC MARK
          </td>
          <td><input type=number placeholder="OUT OF 500">

          </td></tr>

        <tr>
          <td>HSC MARK

          </td>
          <td>
            <input type=number placeholder="OUT OF 600">

          </td>

        </tr>
        
        <tr>
          <td>
          </td>
          <td><br>
            <input class="two" type=submit>
            <input class="tw" type="reset">
          </td>
        </tr>
        

      </table>
    </form>
  </div>

  <div class="c">
    <h4>
      Contact Us<br>example@gmail.com
    </h4>
  </div>
  </center>
</body>
